<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
        :root {
            --background: #060b12;
            --text: #f2f5f7;
            --accent: #72ffc2;
            --error: #ff617d;
            --muted: #27313e;
            --font: Arial, sans-serif;
            --font-size: 14px;
            --space-small: 8px;
            --space-medium: 16px;
            --footer-height: 48px;
            --progress-height: 4px;
            --progress-width: 160px;
            --radius: 0;
            --shadow: none;
            --game-width: 1280px;
        }
        * { box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; margin: 0; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: var(--background);
            color: var(--text);
            font: var(--font-size) var(--font);
        }
        #unity-container {
            width: min(var(--game-width), 100vw, calc((100vh - var(--footer-height)) * 16 / 9));
            width: min(var(--game-width), 100vw, calc((100dvh - var(--footer-height)) * 16 / 9));
        }
        #unity-screen { position: relative; aspect-ratio: 16 / 9; }
        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: var(--background);
            outline: none;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        #unity-loading-bar {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-medium);
            background: var(--background);
        }
        #unity-progress-bar-empty {
            width: min(var(--progress-width), 80%);
            height: var(--progress-height);
            background: var(--muted);
        }
        #unity-progress-bar-full { width: 0; height: 100%; background: var(--accent); }
        #unity-warning {
            position: absolute;
            inset: var(--space-medium);
            display: none;
            padding: var(--space-medium);
            overflow: auto;
            overflow-wrap: anywhere;
            background: var(--background);
        }
        #unity-warning .error { color: var(--error); }
        #unity-footer {
            height: var(--footer-height);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: var(--space-small);
        }
        #unity-fullscreen-button {
            min-height: calc(var(--footer-height) - var(--space-small));
            padding: var(--space-small) var(--space-medium);
            border: 0;
            border-radius: var(--radius);
            background: var(--muted);
            color: var(--text);
            font: inherit;
            cursor: pointer;
        }
        #unity-fullscreen-button:disabled { opacity: 0.5; cursor: default; }
        #unity-fullscreen-button:focus-visible { outline: 2px solid var(--accent); }
    </style>
</head>
<body>
    <main id="unity-container">
        <div id="unity-screen">
            <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="0"></canvas>
            <div id="unity-loading-bar" role="status">
                <span id="unity-loading-text">Loading 0%</span>
                <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
            </div>
            <div id="unity-warning" role="alert"></div>
        </div>
        <div id="unity-footer">
            <button id="unity-fullscreen-button" type="button" disabled>Fullscreen</button>
        </div>
    </main>
    <script>
        const canvas = document.getElementById("unity-canvas");
        const loadingBar = document.getElementById("unity-loading-bar");
        const loadingText = document.getElementById("unity-loading-text");
        const progressBar = document.getElementById("unity-progress-bar-full");
        const warningBanner = document.getElementById("unity-warning");
        const fullscreenButton = document.getElementById("unity-fullscreen-button");

        function showBanner(message, type) {
            const entry = document.createElement("div");
            entry.textContent = message;
            entry.className = type;
            warningBanner.appendChild(entry);
            warningBanner.style.display = "block";
            if (type !== "error") {
                setTimeout(() => {
                    entry.remove();
                    if (!warningBanner.children.length) warningBanner.style.display = "none";
                }, 5000);
            }
        }

        const buildUrl = "Build";
        const config = {
            arguments: [],
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
            workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
            streamingAssetsUrl: "StreamingAssets",
            companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
            productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
            productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
            showBanner
        };
#if BACKGROUND_FILENAME
        canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
        const script = document.createElement("script");
        script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
        script.onerror = () => {
            loadingBar.style.display = "none";
            showBanner("Failed to load " + script.src + ". Reload the page to try again.", "error");
        };
        script.onload = () => {
            createUnityInstance(canvas, config, progress => {
                const percent = Math.round(progress * 100);
                progressBar.style.width = percent + "%";
                loadingText.textContent = "Loading " + percent + "%";
            }).then(instance => {
                loadingBar.style.display = "none";
                fullscreenButton.disabled = false;
                fullscreenButton.onclick = () => instance.SetFullscreen(1);
                canvas.focus();
            }).catch(message => {
                loadingBar.style.display = "none";
                showBanner(String(message), "error");
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
